<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickServe - Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .profile-container {
            max-width: 600px;
            margin: 3rem auto;
            background: #fff;
            border-radius: 10px;
            padding: 2rem;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
        }
        .profile-avatar {
            width: 100px;
            height: 100px;
            background: #f0f0f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: #3498db;
        }
        .profile-info h2 {
            margin-bottom: 0.3rem;
        }
        .profile-info p {
            color: #777;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        .btn-save {
            background: #3498db;
            color: #fff;
            padding: 0.8rem 2rem;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1rem;
            width: 100%;
        }
        .btn-save:hover {
            background: #2980b9;
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1rem;
            color: #3498db;
        }
        .back-link i {
            margin-right: 0.3rem;
        }
        .message {
            padding: 0.8rem;
            border-radius: 5px;
            margin-bottom: 1rem;
            display: none;
        }
        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }
        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
<header>
    <div class="container">
        <div class="logo">
            <h1>Quick<span>Serve</span></h1>
        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/services">Services</a></li>
                <li><a href="/contact">Contact</a></li>
                <li><a href="/profile" class="btn btn-outline active">Profile</a></li>
                <li><a href="/login" class="btn btn-primary">Logout</a></li>
            </ul>
        </nav>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
    </div>
</header>

<main class="container">
    <a href="javascript:history.back()" class="back-link"><i class="fas fa-arrow-left"></i> Back</a>
    <div class="profile-container">
        <div id="profileMessage" class="message"></div>
        <div class="profile-header" id="profileHeader">
            <!-- Populated by JavaScript -->
        </div>
        <form id="profileForm">
            <div class="form-row">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Phone</label>
                <input type="tel" id="phone">
            </div>
            <div class="form-group">
                <label>Address</label>
                <textarea id="address" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="currentPassword" placeholder="Enter current password to change">
            </div>
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPassword" placeholder="Leave blank to keep current">
            </div>
            <button type="submit" class="btn-save">Save Changes</button>
        </form>
    </div>
</main>

<footer>
    <div class="container">
        <div class="footer-content">
            <div class="footer-section">
                <h3>QuickServe</h3>
                <p>Your one-stop solution for all service needs.</p>
            </div>
            <div class="footer-section">
                <h3>Quick Links</h3>
                <ul>
                    <li><a href="/">Home</a></li>
                    <li><a href="/services">Services</a></li>
                    <li><a href="/contact">Contact</a></li>
                    <li><a href="/login">Logout</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h3>Contact Us</h3>
                <p><i class="fas fa-envelope"></i> support@quickserve.com</p>
                <p><i class="fas fa-phone"></i> +1 234 567 890</p>
            </div>
        </div>
        <div class="copyright">
            &copy; 2026 QuickServe. All rights reserved.
        </div>
    </div>
</footer>

<script src="/js/script.js"></script>
<script>
    // Mock user data
    const mockUser = {
        name: 'John Doe',
        email: 'john.customer@gmail.com',
        phone: '555-1234',
        address: '123 Main St, Anytown, USA',
        createdAt: '2026-01-15'
    };

    // Split name
    const nameParts = mockUser.name.split(' ');
    const firstName = nameParts[0];
    const lastName = nameParts.slice(1).join(' ');

    // Populate header
    document.getElementById('profileHeader').innerHTML = `
        <div class="profile-avatar"><i class="fas fa-user"></i></div>
        <div class="profile-info">
            <h2>${mockUser.name}</h2>
            <p>${mockUser.email}</p>
            <p>Member since ${new Date(mockUser.createdAt).toLocaleDateString('en-US', { month: 'short', year: 'numeric' })}</p>
        </div>
    `;

    // Populate form
    document.getElementById('firstName').value = firstName;
    document.getElementById('lastName').value = lastName;
    document.getElementById('email').value = mockUser.email;
    document.getElementById('phone').value = mockUser.phone;
    document.getElementById('address').value = mockUser.address;

    // Handle save
    document.getElementById('profileForm').addEventListener('submit', (e) => {
        e.preventDefault();

        const updatedName = `${document.getElementById('firstName').value} ${document.getElementById('lastName').value}`.trim();
        const updatedEmail = document.getElementById('email').value;
        const updatedPhone = document.getElementById('phone').value;
        const updatedAddress = document.getElementById('address').value;
        const currentPwd = document.getElementById('currentPassword').value;
        const newPwd = document.getElementById('newPassword').value;

        // Simple validation
        if (!updatedName || !updatedEmail) {
            showMessage('error', 'Name and email are required.');
            return;
        }

        if (newPwd && !currentPwd) {
            showMessage('error', 'Please enter current password to change it.');
            return;
        }

        // Mock successful update
        showMessage('success', 'Profile updated successfully!');
        document.querySelector('.profile-info h2').textContent = updatedName;

        // Clear password fields
        document.getElementById('currentPassword').value = '';
        document.getElementById('newPassword').value = '';
    });

    function showMessage(type, text) {
        const msgDiv = document.getElementById('profileMessage');
        msgDiv.className = `message ${type}`;
        msgDiv.textContent = text;
        msgDiv.style.display = 'block';
        setTimeout(() => {
            msgDiv.style.display = 'none';
        }, 3000);
    }
</script>
</body>
</html>
